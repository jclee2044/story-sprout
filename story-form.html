<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story generation</title>
  </head>
  <body>
    <main class="story-form-page">
      <form class="story-form" action="#" method="post">
        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Grade Level</legend>
            <div class="form-card__body">
              <div class="form-row form-row--grade-sentence form-row--single-line">
                <select
                  class="form-control form-control--select"
                  id="story-section"
                  name="section"
                  required
                  aria-label="Section (beginning, middle, or end)"
                >
                  <option value="">Select section</option>
                  <option value="beginning">Beginning</option>
                  <option value="middle">Middle</option>
                  <option value="end">End</option>
                </select>
                <span class="form-grade-sentence__connector">of grade</span>
                <select
                  class="form-control form-control--select"
                  id="story-grade"
                  name="grade"
                  required
                  aria-label="Grade"
                >
                  <option value="">Select grade</option>
                  <option value="K">K</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Word Count</legend>
            <div class="form-card__body">
              <div class="form-field">
                <label class="form-label" for="story-word-count">Word count</label>
                <select
                  class="form-control form-control--select"
                  id="story-word-count"
                  name="word_count"
                  required
                >
                  <option value="">Select word count</option>
                  <option value="25-50">25–50 words</option>
                  <option value="50-75">50–75 words</option>
                  <option value="75-100">75–100 words</option>
                  <option value="100-150">100–150 words</option>
                  <option value="150-200">150–200 words</option>
                  <option value="200-250">200–250 words</option>
                  <option value="250-400">250–400 words</option>
                </select>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Text Type</legend>
            <div class="form-card__body">
              <div class="form-field">
                <label class="form-label" for="story-text-type">Text type</label>
                <select
                  class="form-control form-control--select"
                  id="story-text-type"
                  name="text_type"
                >
                  <option value="">Select text type</option>
                  <option value="fiction">Fiction</option>
                  <option value="nonfiction">Nonfiction</option>
                </select>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Topic</legend>
            <div class="form-card__body">
              <div class="form-field">
                <label class="form-label" for="story-topic">Topic</label>
                <input
                  class="form-control form-control--text"
                  type="text"
                  id="story-topic"
                  name="topic"
                  autocomplete="off"
                >
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Word List</legend>
            <div class="form-card__body">
              <div class="form-field">
                <label class="form-label" for="story-word-list">Word list</label>
                <textarea
                  class="form-control form-control--textarea"
                  id="story-word-list"
                  name="word_list"
                  rows="6"
                ></textarea>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-card">
          <fieldset class="form-card__fieldset">
            <legend class="form-card__heading">Additional Requirements</legend>
            <div class="form-card__body">
              <div class="form-field">
                <label class="form-label" for="story-additional-requirements">Additional requirements</label>
                <textarea
                  class="form-control form-control--textarea"
                  id="story-additional-requirements"
                  name="additional_requirements"
                  rows="6"
                ></textarea>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-actions">
          <button class="form-button form-button--generate" type="button">Generate</button>
        </div>
      </form>
    </main>
  </body>
</html>
