<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Sprout</title>
    <link rel="stylesheet" href="/styles.css?v=1">
    <style>
      /* Comfortaa */
      @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');
      /* Andika — designed for literacy and beginning readers */
      @import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');
      /* OpenDyslexic — font designed specifically to aid dyslexic readers.
         Bottom-weighted letterforms reduce common letter-confusion (b/d, p/q).
         Created by Abelardo Gonzalez, licensed CC-BY 3.0. */
      @import url('https://fonts.cdnfonts.com/css/opendyslexic');
    </style>
  </head>
  <body>

  <div class="bg-scene" aria-hidden="true">
    <div class="bg-sun"></div>
    <div class="bg-cloud cloud-1"></div>
    <div class="bg-cloud cloud-2"></div>
    <div class="bg-cloud cloud-3"></div>
    <div class="bg-butterfly bf1"><span>🦋</span></div>
    <div class="bg-butterfly bf2"><span>🦋</span></div>
    <span class="bg-leaf leaf1">🍃</span>
    <span class="bg-leaf leaf2">🍃</span>
    <span class="bg-leaf leaf3">🍂</span>
    <div class="bg-tree t-left"><div class="canopy"></div><div class="trunk"></div></div>
    <div class="bg-tree t-right"><div class="canopy"></div><div class="trunk"></div></div>
    <div class="bg-flower f1"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-flower f2"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-flower f3"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-flower f4"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-flower f5"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-flower f6"><div class="bloom"></div><div class="stem"></div></div>
    <div class="bg-ground"></div>
  </div>

  <nav class="navbar">
    <a class="navbar__brand" href="story-form.html">
      <img class="navbar__logo" src="img/logo.png" alt="Story Sprout logo">
      <span class="navbar__title">Story Sprout</span>
    </a>
    <ul class="navbar__nav">
      <li><a href="story-form.html"><span class="nav-icon">✏️</span><span>Generate</span></a></li>
      <li><a href="saved-stories.html" class="active"><span class="nav-icon">📚</span><span>Saved Stories</span></a></li>
    </ul>
  </nav>

  <main class="story-viewer-page">
    <h1>Generated Story</h1>

    <div class="story-viewer-layout">
      <section class="story-viewer__story-column" aria-label="Generated story document">
        <div id="storyDocument"></div>
      </section>

      <section id="chatContainer" class="story-viewer__chat" aria-labelledby="chat-heading">
        <h2 id="chat-heading">Edit Story</h2>
        <label for="chatInput">Request Changes</label>
        <textarea id="chatInput" rows="4" placeholder="e.g, 'Make it longer'"></textarea>
        <button type="button" id="sendChatBtn">Send</button>
      </section>

      <section class="story-viewer__text-controls" aria-labelledby="text-appearance-heading">
        <h2 id="text-appearance-heading">Text appearance</h2>
        <div>
          <label for="fontSizeControl">Font size</label>
          <select id="fontSizeControl" name="font_size">
            <option value="xsmall">Extra small</option>
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
            <option value="xlarge">Extra large</option>
          </select>
        </div>

        <div>
          <label for="fontStyleControl">Font style</label>
          <select id="fontStyleControl" name="font_style">
            <option value="Century Gothic, Century Gothic, Futura, sans-serif" selected>Century Gothic</option>
            <option value="Comfortaa, cursive">Comfortaa</option>
            <option value="OpenDyslexic, sans-serif">Dyslexia Font (OpenDyslexic)</option>
            <option value="Andika, sans-serif">Andika</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="Arial, Helvetica, sans-serif">Arial</option>
          </select>
        </div>

        <div>
          <label for="lineSpacingControl">Line spacing</label>
          <select id="lineSpacingControl" name="line_spacing">
            <option value="tight">Tight</option>
            <option value="normal" selected>Normal</option>
            <option value="relaxed">Relaxed</option>
          </select>
        </div>
      </section>

      <div class="story-viewer__actions">
        <button type="button" id="saveStoryBtn">Save Story</button>
        <button type="button" id="exportPdfBtn">Export as PDF</button>
      </div>
    </div>

    <script>
      // ── Render story content ──────────────────────────────────────────────
      const title = localStorage.getItem("generatedStoryTitle") || "";
      const story = localStorage.getItem("generatedStory") || "";
      const doc   = document.getElementById("storyDocument");

      if (title || story) {
        doc.innerHTML = `
          <h2 id="storyTitle">${title}</h2>
          <p id="storyBody">${story.trim()}</p>
        `;
      } else {
        doc.textContent = "No story found. Please go back and generate one.";
      }

      // ── Text-appearance maps ──────────────────────────────────────────────
      const fontSizeMap = {
        xsmall: { doc: "0.9rem",  body: "0.88rem"  },
        small:  { doc: "1rem",    body: "1rem"      },
        medium: { doc: "1.2rem",  body: "1.18rem"   },
        large:  { doc: "1.45rem", body: "1.42rem"   },
        xlarge: { doc: "1.75rem", body: "1.7rem"    },
      };

      const lineHeightMap = {
        tight:   { doc: "1.35", body: "1.4"  },
        normal:  { doc: "1.65", body: "1.65" },
        relaxed: { doc: "2.0",  body: "2.0"  },
      };

      // ── Helper: apply all three settings to #storyDocument ───────────────
      function applyAppearance() {
        const sizeKey    = document.getElementById("fontSizeControl").value;
        const fontValue  = document.getElementById("fontStyleControl").value;
        const spacingKey = document.getElementById("lineSpacingControl").value;

        const sizes   = fontSizeMap[sizeKey]    || fontSizeMap.medium;
        const heights = lineHeightMap[spacingKey] || lineHeightMap.normal;

        // Update the document card itself
        doc.style.fontSize   = sizes.doc;
        doc.style.lineHeight = heights.doc;
        doc.style.fontFamily = fontValue;

        // Also update the story body paragraph if it exists
        const storyBody = document.getElementById("storyBody");
        const storyTitle = document.getElementById("storyTitle");
        if (storyTitle) {
          // Keep title scale in CSS (em-based), but use the selected reading font.
          storyTitle.style.fontFamily = fontValue;
        }
        if (storyBody) {
          storyBody.style.fontSize   = sizes.body;
          storyBody.style.lineHeight = heights.body;
          storyBody.style.fontFamily = fontValue;
        }
      }

      // ── Wire up the controls ──────────────────────────────────────────────
      document.getElementById("fontSizeControl").addEventListener("change",   applyAppearance);
      document.getElementById("fontStyleControl").addEventListener("change",  applyAppearance);
      document.getElementById("lineSpacingControl").addEventListener("change", applyAppearance);

      // Apply defaults on load so the document always starts in a consistent state
      applyAppearance();
    </script>

    <script src="js/pwa.js"></script>
    <script type="module" src="js/story-viewer.js?v=1"></script>
  </body>
</html>
