<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Viewer</title>
    <link rel="icon" type="image/x-icon" href="/img/logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main style="max-width: 800px; margin: 40px auto; padding: 24px;">
      <h1>Generated Story</h1>
      <div id="story-output" style="white-space: pre-wrap; line-height: 1.6;"></div>
      <p style="margin-top: 24px;">
        <a href="story-form.html">← Back to form</a>
      </p>
    </main>

    <script>
      const output = document.getElementById("story-output");
      const story = localStorage.getItem("generatedStory");

      if (story) {
        output.textContent = story;
      } else {
        output.textContent = "No story has been generated yet.";
      }
    </script>
  </body>
</html>
