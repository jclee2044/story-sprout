<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Viewer</title>
    <meta name="theme-color" content="#5A9068">
    <meta name="description" content="View and customize generated reading passages in Story Sprout.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <main class="doc-viewer-page">
      <h1 id="storyTitle">Generated Story</h1>

      <div class="doc-viewer-layout">

        <!-- Story column -->
        <section class="doc-viewer__story-column" aria-label="Generated story document">
          <div id="storyDocument"></div>
          <button type="button" id="saveStoryBtn">Save Story</button>
        </section>

        <!-- Sidebar: chat and text controls -->
        <aside class="doc-viewer__sidebar" aria-label="Chat and text appearance">

          <section id="chatContainer" class="doc-viewer__chat" aria-labelledby="chat-heading">
            <h2 id="chat-heading">Chat</h2>
            <div id="chatMessages"></div>
            <label for="chatInput">Message</label>
            <textarea id="chatInput" rows="4" placeholder="Ask for changes or regeneration…"></textarea>
            <button type="button" id="sendChatBtn">Send</button>
          </section>

          <section class="doc-viewer__text-controls" aria-labelledby="text-appearance-heading">
            <h2 id="text-appearance-heading">Text appearance</h2>

            <div>
              <label for="fontSizeControl">Font size</label>
              <select id="fontSizeControl" name="font_size">
                <option value="">Select…</option>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="xlarge">Extra large</option>
              </select>
            </div>

            <div>
              <label for="fontStyleControl">Font style</label>
              <select id="fontStyleControl" name="font_style">
                <option value="">Select…</option>
                <option value="serif">Serif</option>
                <option value="sans-serif">Sans-serif</option>
                <option value="monospace">Monospace</option>
              </select>
            </div>

            <div>
              <label for="lineSpacingControl">Line spacing</label>
              <select id="lineSpacingControl" name="line_spacing">
                <option value="">Select…</option>
                <option value="tight">Tight</option>
                <option value="normal">Normal</option>
                <option value="relaxed">Relaxed</option>
                <option value="loose">Loose</option>
              </select>
            </div>
          </section>

        </aside>

      </div>

      <p>
        <a href="story-form.html">← Back to form</a>
      </p>
    </main>

    <script src="js/pwa.js"></script>
    <script type="module" src="js/doc-viewer.js"></script>
  </body>
</html>
