<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Garden - Story Sprout</title>
    <meta name="theme-color" content="#5A9068">
    <meta name="description" content="Browse stories saved from Story Sprout.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="story-stash-page">
      <h1>Story Garden</h1>

      <div class="stories-container" aria-label="Saved stories"></div>

      <p>
        <a href="story-form.html">Back to generator</a>
      </p>
    </main>
    <script>
      const storiesContainer = document.querySelector(".stories-container");
      const savedStoriesRaw = localStorage.getItem("savedStories");
      const savedStories = savedStoriesRaw ? JSON.parse(savedStoriesRaw) || {} : {};
      const stories = Object.entries(savedStories);

      if (!stories.length) {
        storiesContainer.innerHTML = "<p>No saved stories yet.</p>";
      } else {
        stories.forEach(([id, story]) => {
          const storyBook = document.createElement("div");
          storyBook.className = "story-book";

          const storyTitle = document.createElement("h2");
          storyTitle.className = "story-book__title";
          storyTitle.textContent = story.title;
          storyTitle.addEventListener("click", () => {
            localStorage.setItem("selectedStoryId", id);
            window.location.href = "story-viewer.html";
          });

          storyBook.appendChild(storyTitle);
          storiesContainer.appendChild(storyBook);
        });
      }
    </script>
    <script src="js/pwa.js"></script>
  </body>
</html>
